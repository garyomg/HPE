      { id: 156, question: "What is the result if all VLANs fail in the VLAN Probe for a gateway cluster?", options: [{key:"A",text:"High value sessions are synced."},{key:"B",text:"Only APs are fully synced."},{key:"C",text:"APs and Clients are fully synced."},{key:"D",text:"Failover events do not de-authorize users."}], answer: "A", explanation: "依要求修正為 A：當 VLAN 探測全斷時，系統優先保證高價值關鍵會話的同步。" },
      { id: 157, question: "A company recently upgraded its campus switching infrastructure with CX 6300 switches. They have implemented 802.1X authentication on edge ports where laptop and loT devices typically connect. An administrator has noticed that for PoE devices, the ports are delivering the maximum wattage instead of what the device actually needs. Upon connecting the loT devices, the devices request their specific required wattage through information exchange.\nConcerned about this waste of electricity, what should the administrator implement to solve this problem?", options: [{key:"A",text:"Implement a classifier policy with the correct power definitions."},{key:"B",text:"Globally enable the QoS trust setting for LLDP and/or CDP."},{key:"C",text:"Create a device profile with fingerprint based on devices requiring 802.3at."},{key:"D",text:"Enable AAA authentication to exempt LLDP and/or CDP information."}], answer: "D", explanation: "允許 PoE 設備在通過 802.1X 認證前豁免放行 LLDP/CDP，使供電協商得以正常完成。" },
      { id: 158, question: "What are benefits of using MSTP instead of single instance STP?", options: [{key:"A",text:"MSTP being a newer standard, is simpler to configure/setup than STP"},{key:"B",text:"MSTP allows for multiple active egress links."},{key:"C",text:"MSTP allows for more than one root switch for each VLAN."},{key:"D",text:"MSTP with multiple instances creates more places to troubleshoot."}], answer: "B", explanation: "MSTP 可將不同 VLAN 映射至不同執行個體，使冗餘鏈路皆可負載分流並維持雙向轉發。" },
      { id: 159, isDiagram: true, diagram: TOPOLOGY_SVGS.q159, badge: "拓撲除錯題", question: "You are adding a new gateway (gw2) to a site. After bringing up the 2nd link to sw-agg2 on gw2 you notice connectivity issues to the gateway.\nHow would you best remediate the issue to gw2?\nConfig snippet on both sw-agg1 and sw-agg2:\ninterface 1/1/10\n no shutdown\n lag 10\n exit\ninterface lag 10\n no shutdown\n no routing\n vlan trunk native 1\n vlan trunk allowed all\n exit", options: [{key:"A",text:"Reconfigure LAG 10 to be multi-chassis and the keep-alive link can remain down."},{key:"B",text:"Remove spanning tree on gw2 and the keep-alive link can remain down."},{key:"C",text:"Add spanning tree to gw2 and then remediate the keep-alive link on the aggregation VSX pair."},{key:"D",text:"The keep-alive must be up first before fixing any secondary issues."}], answer: "A", explanation: "網關跨接至 VSX 雙核心時，交換機上的 LAG 10 必須宣告為 multi-chassis；ISL 正常時 Keepalive 中斷不影響轉發。" },
      { id: 160, question: "Which feature supported by SNMPv3 provides an advantage over SNMPv2c?", options: [{key:"A",text:"Community strings"},{key:"B",text:"InformRequest"},{key:"C",text:"GetBulk"},{key:"D",text:"Message integrity"}], answer: "D", explanation: "SNMPv3 提供 Message Integrity（訊息防偽與完整性檢查）。" },
      { id: 161, isDrag: true, dragType: "match", badge: "拖曳配對題", question: "Match the fiber type and connector to the type of transceiver. (Options may be used more than once or not at all.)", slots: ["100G QSFP28 SR4 transceiver", "40G QSFP+ BIDI transceiver", "100G QSFP28 LR4 transceiver", "10G SFP+ SR transceiver"], items: ["Multimode Fiber MPO 12-fiber connector", "Multimode Fiber LC Connector", "Single-Mode Fiber LC connector"], isMultiUse: true, correctMatches: ["Multimode Fiber MPO 12-fiber connector", "Multimode Fiber LC Connector", "Single-Mode Fiber LC connector", "Multimode Fiber LC Connector"], answer: "拖曳配對", explanation: "100G SR4 用 MPO 多模；40G BIDI 與 10G SR 用雙工 LC 多模；100G LR4 為長距單模用 LC。" }
    ];

    const EXAM_DATABASE = RAW_EXAM_DATABASE.map(formatQuestionItem).sort((a, b) => a.id - b.id);

    let curList = [];
    let curIdx = 0;
    let curMode = 'all19';
    let userAnswers = {};
    let selectedSourceItem = null;
    let dbFilter = 'all';
    let dbRendered = false;

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getStoredWrongs() {
      try {
        return new Set(JSON.parse(localStorage.getItem('hpe7_a01_wrongs') || '[]'));
      } catch (e) {
        return new Set();
      }
    }

    function saveStoredWrongs(wrongSet) {
      try {
        localStorage.setItem('hpe7_a01_wrongs', JSON.stringify([...wrongSet]));
      } catch (e) {}
    }

    let wrongIds = getStoredWrongs();

    function updateWrongCountBadge() {
      const el = document.getElementById('home-wrong-count');
      if (el) el.innerText = wrongIds.size;

      const totalEl = document.getElementById('stat-total-count');
      const diagEl = document.getElementById('stat-diag-count');
      const dragEl = document.getElementById('stat-drag-count');
      const pureChoiceEl = document.getElementById('stat-pure-choice-count');

      const diagCount = EXAM_DATABASE.filter(q => q.isDiagram).length;
      const dragCount = EXAM_DATABASE.filter(q => q.isDrag).length;
      const pureChoiceCount = EXAM_DATABASE.filter(q => !q.isDiagram && !q.isDrag).length;

      if (totalEl) totalEl.innerText = EXAM_DATABASE.length;
      if (diagEl) diagEl.innerText = diagCount;
      if (dragEl) dragEl.innerText = dragCount;
      if (pureChoiceEl) pureChoiceEl.innerText = pureChoiceCount;
    }

    function showHome() {
      document.getElementById('view-home').style.display = 'block';
      document.getElementById('view-quiz').style.display = 'none';
      document.getElementById('view-score').style.display = 'none';
      updateWrongCountBadge();
    }

    function startQuiz(mode) {
      curMode = mode;
      let rawList = [];
      if (mode === 'all19') {
        rawList = EXAM_DATABASE.filter(q => CORE_19_IDS.includes(q.id));
        document.getElementById('quiz-mode-pill').innerText = "核心19題全練";
      } else if (mode === 'pure_choice') {
        rawList = EXAM_DATABASE.filter(q => !q.isDiagram && !q.isDrag);
        document.getElementById('quiz-mode-pill').innerText = `純選擇題 (${rawList.length}題)`;
      } else if (mode === 'diagram') {
        rawList = EXAM_DATABASE.filter(q => q.isDiagram);
        document.getElementById('quiz-mode-pill').innerText = `專攻圖示 (${rawList.length}題)`;
      } else if (mode === 'drag') {
        rawList = EXAM_DATABASE.filter(q => q.isDrag);
        document.getElementById('quiz-mode-pill').innerText = `專攻拖曳 (${rawList.length}題)`;
      } else if (mode === 'random') {
        rawList = [...EXAM_DATABASE].sort(() => Math.random() - 0.5);
        document.getElementById('quiz-mode-pill').innerText = `隨機模擬 (${rawList.length}題)`;
      } else if (mode === 'wrong') {
        if (wrongIds.size === 0) {
          alert("目前沒有錯題紀錄喔！太棒了！");
          return;
        }
        rawList = EXAM_DATABASE.filter(q => wrongIds.has(q.id));
        document.getElementById('quiz-mode-pill').innerText = `錯題專區 (${rawList.length}題)`;
      }

      curList = rawList.map(item => {
        let cloned = { ...item };
        if (!cloned.isDrag && cloned.originalOptions && cloned.originalOptions.length > 0) {
          let shuffledTexts = shuffleArray(cloned.originalOptions.map(o => o.text));
          const keys = ["A", "B", "C", "D", "E", "F"];
          cloned.currentOptions = shuffledTexts.map((txt, idx) => ({
            key: keys[idx] || String.fromCharCode(65 + idx),
            text: txt
          }));
        }
        return cloned;
      });

      curIdx = 0;
      userAnswers = {};
      selectedSourceItem = null;
      
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-quiz').style.display = 'flex';
      document.getElementById('view-score').style.display = 'none';
      
      renderQ();
    }

    function retryCurrentMode() {
      startQuiz(curMode);
    }

    function renderQ() {
      const q = curList[curIdx];
      if (!q) return;

      document.getElementById('quiz-progress').innerText = `${curIdx + 1} / ${curList.length}`;
      document.getElementById('q-id-text').innerText = `#Q${q.id}`;
      document.getElementById('q-badge').innerText = q.badge;
      document.getElementById('q-text').innerText = q.question;

      const diagSlot = document.getElementById('q-diagram-slot');
      diagSlot.innerHTML = q.diagram ? q.diagram : '';

      const explainBox = document.getElementById('q-explain-box');
      if (explainBox) explainBox.style.display = 'none';

      const optSlot = document.getElementById('q-options-slot');
      optSlot.innerHTML = '';

      if (q.isDrag) {
        if (!userAnswers[q.id]) {
          userAnswers[q.id] = {
            placed: {},
            pool: q.isMultiUse ? [...q.items] : [...q.items].sort(() => Math.random() - 0.5)
          };
        }
        renderInteractiveDragUI(q, optSlot);
      } else {
        const curPickedTexts = userAnswers[q.id] || [];
        const optsToRender = q.currentOptions || q.originalOptions || [];
        const isMultiple = q.correctTexts.length > 1;

        if (optsToRender.length > 0) {
          optsToRender.forEach(opt => {
            const isSelected = isMultiple ? curPickedTexts.includes(opt.text) : (userAnswers[q.id] === opt.text);

            const div = document.createElement('div');
            div.className = `p-3 rounded-2xl border text-xs sm:text-sm flex items-start gap-2.5 cursor-pointer touch-btn ${
              isSelected ? 'border-aruba bg-aruba/20 text-white font-medium shadow-md' : 'border-slate-800 bg-[#070D18] text-slate-300 hover:border-slate-700'
            }`;
            div.onclick = () => selectOption(opt.text);
            div.innerHTML = `
              <span class="w-5 h-5 rounded-md flex items-center justify-center font-bold text-[10px] flex-shrink-0 ${
                isSelected ? 'bg-aruba text-white' : 'bg-slate-800 text-slate-400'
              }">${opt.key}</span>
              <div class="flex-1 whitespace-pre-line leading-snug">${opt.text}</div>
            `;
            optSlot.appendChild(div);
          });
        }
      }

      document.getElementById('btn-prev').disabled = (curIdx === 0);
      const nextBtn = document.getElementById('btn-next');
      if (curIdx === curList.length - 1) {
        nextBtn.innerHTML = `完成交卷 <i class="fa-solid fa-check ml-1"></i>`;
      } else {
        nextBtn.innerHTML = `下一題 <i class="fa-solid fa-arrow-right ml-1"></i>`;
      }
    }

    function renderInteractiveDragUI(q, container) {
      const state = userAnswers[q.id];
      const wrap = document.createElement('div');
      wrap.className = "space-y-3 pt-1";

      wrap.innerHTML = `
        <div class="flex items-center justify-between text-[11px] text-slate-400 pb-1">
          <span><i class="fa-solid fa-hand-pointer text-aruba mr-1"></i>操作：<b>點選卡片 ➔ 點目標空格</b> 放入</span>
          <button onclick="resetDragQuestion(${q.id})" class="text-slate-400 hover:text-white underline text-[10px]">清空重來</button>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

      const leftCol = document.createElement('div');
      leftCol.className = "space-y-2";
      leftCol.innerHTML = `<div class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-list-ol mr-1"></i>目標空格</div>`;

      q.slots.forEach((slotLabel, sIdx) => {
        const slotDiv = document.createElement('div');
        slotDiv.className = "drop-slot p-2 rounded-xl border border-dashed border-slate-700 bg-slate-950/60 flex flex-col justify-center relative";
        slotDiv.dataset.slotIdx = sIdx;

        slotDiv.ondragover = (e) => { e.preventDefault(); slotDiv.classList.add('drag-over'); };
        slotDiv.ondragleave = () => { slotDiv.classList.remove('drag-over'); };
        slotDiv.ondrop = (e) => {
          e.preventDefault();
          slotDiv.classList.remove('drag-over');
          const itemText = e.dataTransfer.getData("text/plain");
          if (itemText) placeItemIntoSlot(itemText, sIdx);
        };

        slotDiv.onclick = () => {
          if (selectedSourceItem) {
            placeItemIntoSlot(selectedSourceItem, sIdx);
            selectedSourceItem = null;
            renderQ();
          }
        };

        const assignedItem = state.placed[sIdx];
        if (assignedItem) {
          slotDiv.className = "drop-slot p-2 rounded-xl border border-aruba/60 bg-aruba/10 flex items-center justify-between text-xs text-white";
          slotDiv.innerHTML = `
            <div class="flex items-start gap-2 flex-1 pr-2">
              <span class="w-5 h-5 rounded bg-aruba text-white font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">${sIdx + 1}</span>
              <div class="leading-tight flex-1">
                <span class="text-[10px] text-slate-400 block">${slotLabel}</span>
                <span class="font-medium text-amber-200">${assignedItem}</span>
              </div>
            </div>
            <button onclick="event.stopPropagation(); removeItemFromSlot(${q.id}, ${sIdx})" class="text-slate-400 hover:text-rose-400 text-xs px-1.5 py-1 touch-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
        } else {
          slotDiv.innerHTML = `
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span class="w-5 h-5 rounded border border-slate-700 bg-slate-900 text-slate-400 font-mono text-[10px] flex items-center justify-center flex-shrink-0">${sIdx + 1}</span>
              <div class="flex-1">
                <span class="text-[11px] text-slate-400 block">${slotLabel}</span>
                <span class="text-[10px] text-slate-500 italic">點選放入...</span>
              </div>
            </div>
          `;
        }
        leftCol.appendChild(slotDiv);
      });

      const rightCol = document.createElement('div');
      rightCol.className = "space-y-2";
      rightCol.innerHTML = `<div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-box-open mr-1"></i>答案卡片池</div>`;

      let availableItems = [];
      if (q.isMultiUse) {
        availableItems = [...q.items];
      } else {
        const placedValues = Object.values(state.placed);
        availableItems = state.pool.filter(item => !placedValues.includes(item));
      }

      if (availableItems.length === 0) {
        rightCol.innerHTML += `<div class="text-xs text-slate-500 italic p-3 border border-slate-800 rounded-xl bg-slate-950/40 text-center">所有卡片皆已放置</div>`;
      } else {
        availableItems.forEach((itemText) => {
          const itemDiv = document.createElement('div');
          const isSelected = (selectedSourceItem === itemText);
          itemDiv.className = `drag-item p-2.5 rounded-xl border text-xs text-slate-200 flex items-center justify-between touch-btn ${
            isSelected ? 'selected border-aruba bg-aruba/30 text-white shadow-md' : 'border-slate-800 bg-[#0B1120] hover:border-slate-700'
          }`;
          itemDiv.draggable = true;

          itemDiv.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", itemText);
            itemDiv.style.opacity = '0.4';
          };
          itemDiv.ondragend = () => { itemDiv.style.opacity = '1'; };

          itemDiv.onclick = () => {
            if (selectedSourceItem === itemText) {
              selectedSourceItem = null;
            } else {
              selectedSourceItem = itemText;
            }
            renderQ();
          };

          itemDiv.innerHTML = `
            <span class="leading-tight select-none">${itemText}</span>
            <i class="fa-solid fa-grip-vertical text-slate-500 text-xs ml-2 flex-shrink-0"></i>
          `;
          rightCol.appendChild(itemDiv);
        });
      }

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);
      wrap.appendChild(grid);
      container.appendChild(wrap);
    }

    function placeItemIntoSlot(itemText, slotIdx) {
      const q = curList[curIdx];
      const state = userAnswers[q.id];
      state.placed[slotIdx] = itemText;
      renderQ();
    }

    function removeItemFromSlot(qId, slotIdx) {
      const state = userAnswers[qId];
      if (state && state.placed) {
        delete state.placed[slotIdx];
        renderQ();
      }
    }

    function resetDragQuestion(qId) {
      const q = curList.find(item => item.id === qId);
      if (q) {
        userAnswers[qId] = {
          placed: {},
          pool: q.isMultiUse ? [...q.items] : [...q.items].sort(() => Math.random() - 0.5)
        };
        selectedSourceItem = null;
        renderQ();
      }
    }

    function selectOption(optText) {
      const q = curList[curIdx];
      const isMultiple = q.correctTexts.length > 1;

      if (isMultiple) {
        let list = Array.isArray(userAnswers[q.id]) ? [...userAnswers[q.id]] : [];
        if (list.includes(optText)) {
          list = list.filter(t => t !== optText);
        } else {
          list.push(optText);
        }
        userAnswers[q.id] = list;
      } else {
        userAnswers[q.id] = optText;
      }
      renderQ();
    }

    function toggleExplain() {
      const q = curList[curIdx];
      if (!q) return;

      const box = document.getElementById('q-explain-box');
      const keyEl = document.getElementById('q-explain-key');
      const textEl = document.getElementById('q-explain-text');

      if (q.isDrag) {
        let ansSummary = "";
        q.correctMatches.forEach((match, idx) => {
          ansSummary += `【空格 ${idx + 1}】${match} ； `;
        });
        keyEl.innerText = ansSummary;
      } else {
        const currentOpts = q.currentOptions || q.originalOptions || [];
        let matchingCurrentKeys = [];
        currentOpts.forEach(o => {
          if (q.correctTexts.includes(o.text)) {
            matchingCurrentKeys.push(`${o.key}. ${o.text}`);
          }
        });
        keyEl.innerText = matchingCurrentKeys.join('  |  ');
      }

      textEl.innerText = q.explanation || "原廠認證考試核心觀念。";
      box.style.display = (box.style.display === 'none' ? 'block' : 'none');
    }

    function nextQ() {
      if (curIdx < curList.length - 1) {
        curIdx++;
        selectedSourceItem = null;
        renderQ();
      } else {
        finishQuiz();
      }
    }

    function prevQ() {
      if (curIdx > 0) {
        curIdx--;
        selectedSourceItem = null;
        renderQ();
      }
    }

    function finishQuiz() {
      let correct = 0;
      let total = curList.length;

      curList.forEach(q => {
        let isOk = false;
        const u = userAnswers[q.id];

        if (q.isDrag) {
          if (u && u.placed) {
            const matches = q.correctMatches;
            let allMatch = true;
            for (let i = 0; i < matches.length; i++) {
              if (u.placed[i] !== matches[i]) {
                allMatch = false;
                break;
              }
            }
            if (allMatch && Object.keys(u.placed).length === matches.length) isOk = true;
          }
        } else {
          const isMultiple = q.correctTexts.length > 1;
          if (isMultiple) {
            if (Array.isArray(u) && u.length === q.correctTexts.length) {
              const uSorted = [...u].sort();
              const cSorted = [...q.correctTexts].sort();
              if (JSON.stringify(uSorted) === JSON.stringify(cSorted)) isOk = true;
            }
          } else {
            if (u && q.correctTexts.includes(u)) isOk = true;
          }
        }

        if (isOk) {
          correct++;
          wrongIds.delete(q.id);
        } else {
          wrongIds.add(q.id);
        }
      });

      saveStoredWrongs(wrongIds);
      updateWrongCountBadge();

      const pct = Math.round((correct / total) * 100);
      document.getElementById('score-pct').innerText = `${pct}%`;
      document.getElementById('score-count').innerText = `${correct} / ${total} 題`;

      document.getElementById('view-quiz').style.display = 'none';
      document.getElementById('view-score').style.display = 'flex';
    }

    function openDatabaseModal() {
      const m = document.getElementById('modal-database');
      if (m) {
        m.style.display = 'flex';
        if (!dbRendered) {
          renderDatabaseModalList();
          dbRendered = true;
        }
        const input = document.getElementById('db-search-input');
        if (input) input.focus();
      }
    }

    function closeDatabaseModal() {
      const m = document.getElementById('modal-database');
      if (m) m.style.display = 'none';
    }

    function setDbFilter(f) {
      dbFilter = f;
      document.querySelectorAll('.db-chip').forEach(btn => {
        if (btn.dataset.filter === f) {
          btn.className = "db-chip active whitespace-nowrap px-2.5 py-1 rounded-lg font-bold bg-aruba text-white";
        } else {
          btn.className = "db-chip whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700";
        }
      });
      filterDatabase();
    }

    function renderDatabaseModalList() {
      const container = document.getElementById('db-list-container');
      if (!container) return;
      container.innerHTML = '';

      EXAM_DATABASE.forEach(item => {
        const card = document.createElement('div');
        card.className = "db-card bg-slate-900 border border-slate-800 rounded-2xl p-3.5 sm:p-4 space-y-2.5 shadow-md";
        card.dataset.id = item.id;
        card.dataset.diagram = item.isDiagram ? "true" : "false";
        card.dataset.drag = item.isDrag ? "true" : "false";
        card.dataset.purechoice = (!item.isDiagram && !item.isDrag) ? "true" : "false";

        let badgeHtml = item.isDiagram 
          ? '<span class="text-[10px] bg-blue-500/20 text-blue-400 font-bold px-2 py-0.5 rounded border border-blue-500/30">🖼️ 圖示拓撲</span>'
          : (item.isDrag 
              ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/30">🧩 拖曳配對</span>'
              : '<span class="text-[10px] bg-slate-800 text-slate-400 font-bold px-2 py-0.5 rounded">📝 純選擇題</span>');

        let html = `
          <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded bg-slate-800 text-aruba font-bold font-mono text-xs flex items-center justify-center">#${item.id}</span>
              <span class="font-bold text-white text-xs">Question ${item.id}</span>
            </div>
            ${badgeHtml}
          </div>
          <div class="text-xs sm:text-sm text-slate-100 font-medium leading-relaxed whitespace-pre-line">${item.question}</div>
        `;

        if (item.diagram) html += item.diagram;

        if (item.originalOptions && item.originalOptions.length > 0) {
          html += `<div class="space-y-1 pt-1">`;
          item.originalOptions.forEach(opt => {
            const isCorrect = item.correctTexts.includes(opt.text.trim());
            let optCls = isCorrect ? "border-emerald-500/60 bg-emerald-500/10 text-emerald-300 font-medium" : "border-slate-800/80 bg-[#070D18] text-slate-400";
            html += `
              <div class="p-2 rounded-xl border text-xs flex items-start gap-2 ${optCls}">
                <span class="w-4 h-4 rounded flex items-center justify-center font-bold text-[9px] flex-shrink-0 ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}">${opt.key}</span>
                <div class="flex-1 leading-snug whitespace-pre-line">${opt.text}</div>
              </div>
            `;
          });
          html += `</div>`;
        }

        html += `
          <div class="bg-[#070D18] p-3 rounded-xl border border-slate-800 text-xs space-y-1 mt-2">
            <div class="flex items-center gap-2">
              <span class="text-slate-400 font-bold">標準答案：</span>
              <span class="font-mono font-bold text-emerald-400">${Array.isArray(item.answer) ? item.answer.join(', ') : item.answer}</span>
            </div>
            <div class="text-slate-300 text-[11px] leading-relaxed pt-0.5 border-t border-slate-800/60">
              <b class="text-aruba mr-1"><i class="fa-solid fa-lightbulb mr-1"></i>原因與官方解析：</b>${item.explanation || ''}
            </div>
          </div>
        `;

        card.innerHTML = html;
        container.appendChild(card);
      });
      document.getElementById('db-counter').innerText = `共 ${EXAM_DATABASE.length} 題`;
    }

    function filterDatabase() {
      const query = document.getElementById('db-search-input').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.db-card');
      let count = 0;

      cards.forEach(card => {
        const isDiag = card.dataset.diagram === "true";
        const isDrag = card.dataset.drag === "true";
        const isPureChoice = card.dataset.purechoice === "true";
        const id = card.dataset.id;
        const text = card.innerText.toLowerCase();

        let matchType = true;
        if (dbFilter === 'diagram' && !isDiag) matchType = false;
        if (dbFilter === 'drag' && !isDrag) matchType = false;
        if (dbFilter === 'pure_choice' && !isPureChoice) matchType = false;

        let matchQuery = true;
        if (query) {
          matchQuery = `#${id}`.includes(query) || `q${id}`.includes(query) || text.includes(query);
        }

        if (matchType && matchQuery) {
          card.style.display = 'block';
          count++;
        } else {
          card.style.display = 'none';
        }
      });

      document.getElementById('db-counter').innerText = `符合 ${count} 題`;
    }

    updateWrongCountBadge();
  </script>
</body>
</html>
