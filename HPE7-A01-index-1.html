<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HPE7-A01 認證考試模擬系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aruba: { DEFAULT: '#FF8300', hover: '#E57600', dark: '#CC6900' }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-sizing: border-box; }
    html, body { height: 100%; height: 100dvh; background-color: #070D18; color: #F1F5F9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .safe-top { padding-top: max(env(safe-area-inset-top, 0px), 12px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px); }
    .touch-btn:active { transform: scale(0.98); opacity: 0.9; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    .card-dark { background: #0F172A; border: 1px solid #1E293B; }
    .drag-item { cursor: grab; user-select: none; transition: all 0.15s ease; }
    .drag-item:active { cursor: grabbing; }
    .drag-item.selected { border-color: #FF8300 !important; background-color: rgba(255, 131, 0, 0.25) !important; transform: scale(1.02); }
    .drop-slot { min-height: 52px; transition: all 0.2s ease; }
    .drop-slot.drag-over { border-color: #38BDF8 !important; background-color: rgba(56, 189, 248, 0.15) !important; }
  </style>
</head>
<body class="flex flex-col antialiased overflow-hidden select-none">

  <!-- ================= 頂部導航列 ================= -->
  <header class="bg-[#0B1120] border-b border-slate-800 safe-top flex-shrink-0 z-30 px-4 h-14 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="showHome()">
      <div class="w-8 h-8 rounded-lg bg-aruba flex items-center justify-center font-black text-white shadow text-base">
        <i class="fa-solid fa-network-wired text-sm"></i>
      </div>
      <div class="flex flex-col">
        <span class="font-bold text-white text-sm">HPE7-A01</span>
        <span class="text-[10px] text-slate-400 leading-none">全題庫・選項亂數・圖示與拖曳模擬</span>
      </div>
    </div>
    
    <button onclick="openDatabaseModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-3 py-1.5 rounded-xl shadow flex items-center gap-1.5 touch-btn">
      <i class="fa-solid fa-book-open text-aruba"></i>
      <span>真題庫速查</span>
    </button>
  </header>

  <!-- ================= 主畫面區 ================= -->
  <main class="flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-4 flex flex-col justify-center max-w-2xl w-full mx-auto pb-8">

    <!-- 1. 首頁視圖 -->
    <section id="view-home" class="space-y-4 my-auto max-w-lg mx-auto w-full" style="display: block;">
      
      <!-- 四項數據統計卡片 -->
      <div class="grid grid-cols-4 gap-2">
        <div class="card-dark rounded-2xl p-2.5 text-center shadow">
          <div class="text-[10px] text-slate-400 font-medium mb-0.5 flex items-center justify-center gap-1">
            <i class="fa-solid fa-layer-group text-slate-400"></i>
            <span>總題數</span>
          </div>
          <div class="text-xl font-extrabold text-white font-mono" id="stat-total-count">--</div>
        </div>

        <div class="card-dark rounded-2xl p-2.5 text-center shadow">
          <div class="text-[10px] text-slate-400 font-medium mb-0.5 flex items-center justify-center gap-1">
            <i class="fa-solid fa-image text-cyan-400"></i>
            <span>圖示題</span>
          </div>
          <div class="text-xl font-extrabold text-cyan-400 font-mono" id="stat-diag-count">--</div>
        </div>

        <div class="card-dark rounded-2xl p-2.5 text-center shadow">
          <div class="text-[10px] text-slate-400 font-medium mb-0.5 flex items-center justify-center gap-1">
            <i class="fa-solid fa-shuffle text-amber-400"></i>
            <span>拖曳題</span>
          </div>
          <div class="text-xl font-extrabold text-amber-400 font-mono" id="stat-drag-count">--</div>
        </div>

        <div class="card-dark rounded-2xl p-2.5 text-center shadow">
          <div class="text-[10px] text-slate-400 font-medium mb-0.5 flex items-center justify-center gap-1">
            <i class="fa-solid fa-pen-to-square text-emerald-400"></i>
            <span>純選擇</span>
          </div>
          <div class="text-xl font-extrabold text-emerald-400 font-mono" id="stat-pure-choice-count">--</div>
        </div>
      </div>

      <!-- 核心 19 題練習 -->
      <button onclick="startQuiz('all19')" class="w-full bg-[#FF8300] hover:bg-aruba-hover text-white font-bold py-4 px-5 rounded-2xl text-base shadow-xl flex items-center justify-center gap-2.5 touch-btn">
        <i class="fa-solid fa-circle-play text-lg"></i>
        <span>練習核心 19 題 (圖示 13 + 拖曳 6)</span>
      </button>

      <!-- 專攻分流按鈕列 -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="startQuiz('pure_choice')" class="card-dark hover:bg-slate-800 py-3.5 px-3 rounded-2xl text-xs font-semibold text-emerald-200 border border-emerald-800/40 flex items-center justify-center gap-2 shadow touch-btn">
          <i class="fa-solid fa-pen-to-square text-emerald-400 text-base"></i>
          <span>純文字選擇題 (選項隨機洗牌)</span>
        </button>

        <button onclick="startQuiz('diagram')" class="card-dark hover:bg-slate-800 py-3.5 px-3 rounded-2xl text-xs font-semibold text-slate-200 flex items-center justify-center gap-2 shadow touch-btn">
          <i class="fa-solid fa-image text-cyan-400 text-base"></i>
          <span>專攻圖示拓撲 (13題)</span>
        </button>

        <button onclick="startQuiz('drag')" class="card-dark hover:bg-slate-800 py-3.5 px-3 rounded-2xl text-xs font-semibold text-slate-200 flex items-center justify-center gap-2 shadow touch-btn">
          <i class="fa-solid fa-shuffle text-amber-400 text-base"></i>
          <span>專攻拖曳配對 (6題)</span>
        </button>

        <button onclick="startQuiz('random')" class="card-dark hover:bg-slate-800 py-3.5 px-3 rounded-2xl text-xs font-semibold text-purple-200 border border-purple-800/40 flex items-center justify-center gap-2 shadow touch-btn">
          <i class="fa-solid fa-dice text-purple-400 text-base"></i>
          <span>全題庫隨機模擬 (題目+選項打亂)</span>
        </button>
      </div>

      <!-- 錯題複習專區 -->
      <button onclick="startQuiz('wrong')" class="w-full bg-[#160E18] hover:bg-[#201322] border border-rose-950/80 py-3.5 px-4 rounded-2xl text-xs font-bold text-rose-400 flex items-center justify-center gap-2 shadow touch-btn">
        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>
        <span>錯題複習專區 ( <span id="home-wrong-count">0</span> )</span>
      </button>
    </section>

    <!-- 2. 測驗作答視圖 -->
    <section id="view-quiz" class="flex-col space-y-3 my-auto w-full" style="display: none;">
      <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-2">
        <button onclick="showHome()" class="text-slate-400 hover:text-white flex items-center gap-1 touch-btn">
          <i class="fa-solid fa-chevron-left text-[11px]"></i> 回首頁
        </button>
        <span id="quiz-progress" class="font-mono text-aruba font-bold bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800">1 / 1</span>
        <span id="quiz-mode-pill" class="text-[10px] text-cyan-400 bg-cyan-950/40 border border-cyan-800/40 px-2 py-0.5 rounded-full font-bold">測驗模式</span>
      </div>

      <div class="card-dark rounded-3xl p-4 sm:p-5 space-y-3.5 shadow-2xl">
        <div class="flex items-center justify-between">
          <span id="q-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">選擇題</span>
          <span id="q-id-text" class="font-mono text-xs text-slate-400 font-bold">#Q1</span>
        </div>

        <h3 id="q-text" class="text-xs sm:text-sm font-semibold text-slate-100 leading-relaxed whitespace-pre-line"></h3>

        <!-- 圖示槽 -->
        <div id="q-diagram-slot"></div>

        <!-- 作答區 -->
        <div id="q-options-slot" class="space-y-2 pt-1"></div>

        <!-- 解析抽屜 -->
        <div id="q-explain-box" class="bg-[#070D18] p-3.5 rounded-2xl border border-slate-800 text-xs space-y-1.5 mt-2" style="display: none;">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 font-bold flex items-center gap-1"><i class="fa-solid fa-circle-info text-aruba"></i> 標準答案：</span>
            <span id="q-explain-key" class="font-mono font-bold text-emerald-400 text-xs sm:text-sm"></span>
          </div>
          <p id="q-explain-text" class="text-slate-300 text-[11px] leading-relaxed"></p>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <button onclick="prevQ()" id="btn-prev" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 touch-btn disabled:opacity-30">
          <i class="fa-solid fa-arrow-left mr-1"></i> 上一題
        </button>
        <div class="flex items-center gap-2">
          <button onclick="toggleExplain()" id="btn-explain" class="px-3.5 py-2 bg-slate-800 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold touch-btn">
            看解析
          </button>
          <button onclick="nextQ()" id="btn-next" class="px-5 py-2 bg-aruba text-white rounded-xl text-xs font-bold shadow touch-btn">
            下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- 3. 測驗結算視圖 -->
    <section id="view-score" class="flex-col items-center justify-center space-y-4 text-center my-auto py-6 max-w-md mx-auto w-full" style="display: none;">
      <div class="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-3xl border border-emerald-500/30">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white mb-1">測驗完成！</h2>
        <p class="text-xs text-slate-400">已完整演練選定題型</p>
      </div>

      <div class="grid grid-cols-2 gap-3 w-full max-w-xs bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <div>
          <span class="text-[10px] text-slate-400 block">正確率</span>
          <span id="score-pct" class="text-2xl font-black text-aruba font-mono">100%</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 block">答對題數</span>
          <span id="score-count" class="text-2xl font-black text-emerald-400 font-mono">0 / 0</span>
        </div>
      </div>

      <div class="flex gap-2.5 w-full max-w-xs pt-2">
        <button onclick="showHome()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold border border-slate-700 touch-btn">
          回到首頁
        </button>
        <button onclick="retryCurrentMode()" class="flex-1 py-3 rounded-xl bg-aruba text-white text-xs font-bold shadow touch-btn">
          再測一次

    </section>

  </main>

  <!-- ================= 題庫速查彈跳視窗 ================= -->

    <div class="bg-[#0B1120] border-t sm:border border-slate-700 rounded-t-3xl sm:rounded-3xl w-full max-w-3xl mx-auto h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-3.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-book-open text-aruba text-sm"></i>
          <h3 class="font-bold text-sm text-white">HPE7-A01 真題庫速查</h3>
          <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono" id="db-counter">共 161 題</span>
        </div>
        <button onclick="closeDatabaseModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center touch-btn">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="p-3 bg-[#070D18] border-b border-slate-800 flex flex-col gap-2 flex-shrink-0">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input type="text" id="db-search-input" oninput="filterDatabase()" placeholder="搜尋題號 (#6, #21, #45)、關鍵字 (VSX, OSPF, operators)..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-aruba" />
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-0.5 text-[11px]">
          <button onclick="setDbFilter('all')" class="db-chip active whitespace-nowrap px-2.5 py-1 rounded-lg font-bold bg-aruba text-white" data-filter="all">全部 (161)</button>
          <button onclick="setDbFilter('pure_choice')" class="db-chip whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700" data-filter="pure_choice">📝 純選擇題 (142)</button>
          <button onclick="setDbFilter('diagram')" class="db-chip whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700" data-filter="diagram">🖼️ 圖示題 (13)</button>
          <button onclick="setDbFilter('drag')" class="db-chip whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700" data-filter="drag">🧩 拖曳題 (6)</button>
        </div>
      </div>

      <div id="db-list-container" class="flex-1 overflow-y-auto custom-scrollbar p-3 sm:p-5 space-y-4"></div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT 全題庫資料與核心邏輯 ================= -->
  <script>
    // 格式轉換器：預先將正確答案的「純文字內容」抓取儲存，確保選項亂數洗牌後比對精確
    function formatQuestionItem(item) {
      let opts = [];
      if (item.options) {
        opts = item.options.map(o => ({ key: o.key, text: o.text }));
      }

      let rawAns = item.answer || "A";
      let correctKeys = Array.isArray(rawAns) ? rawAns : (typeof rawAns === 'string' && rawAns.includes(',') ? rawAns.split(',').map(s => s.trim()) : [rawAns]);

      // 提取正確答案的文字內容
      let correctTexts = [];
      if (opts.length > 0) {
        correctTexts = opts.filter(o => correctKeys.includes(o.key)).map(o => o.text.trim());
      }

      return {
        id: item.id,
        badge: item.badge || (item.isDiagram ? "圖示拓撲題" : (item.isDrag ? "拖曳配對題" : "純文字選擇題")),
        question: item.question || "",
        originalOptions: opts, // 保留原始順序給資料庫速查
        correctTexts: correctTexts, // 綁定正解內文
        answer: Array.isArray(rawAns) ? rawAns : (correctKeys.length > 1 ? correctKeys : correctKeys[0]),
        explanation: item.explanation || "原廠認證官方核心技術考點。",
        diagram: item.diagram || '',
        isDiagram: !!item.isDiagram,
        isDrag: !!item.isDrag,
        dragType: item.dragType || '',
        slots: item.slots || [],
        items: item.items || [],
        correctMatches: item.correctMatches || [],
        isMultiUse: !!item.isMultiUse
      };
    }

      { id: 20, isDrag: true, dragType: "order", badge: "拖曳配對題", question: "Order of operations for Key Management service for wireless client roaming AP1 to AP2?", slots: ["順序 1", "順序 2", "順序 3", "順序 4", "順序 5"], items: ["Client associates and authenticates to AP1", "Cache the client's information", "Get AP1 neighbor AP list", "Generate Pairwise Master Key keys for AP1's neighbors", "Share Pairwise Master Key along with VLAN and User Role to target APs"], correctMatches: ["Client associates and authenticates to AP1", "Cache the client's information", "Get AP1 neighbor AP list", "Generate Pairwise Master Key keys for AP1's neighbors", "Share Pairwise Master Key along with VLAN and User Role to target APs"], answer: "拖曳配對", explanation: "金鑰漫遊順序：AP1認證 -> 快取資訊 -> 獲取鄰居清單 -> 生成周邊PMK -> 分派金鑰至目標AP。" },
      { id: 21, question: "AOS-CX switch management role: view nonsensitive configuration only, level 1 privilege.", options: [{key:"A",text:"sysops"},{key:"B",text:"auditors"},{key:"C",text:"config"},{key:"D",text:"operators"}], answer: "D", explanation: "operators 是 AOS-CX 最低權限（Level 1）的唯讀管理角色。" },
      { id: 22, question: "What is an OSPF transit network?", options: [{key:"A",text:"a network using tunnels to connect two areas"},{key:"B",text:"a network connecting to different routing protocol"},{key:"C",text:"a special network connecting two areas"},{key:"D",text:"a network on which a router discovers at least one neighbor"}], answer: "D", explanation: "OSPF Transit 網路指路由器能在此網段發現至少一個鄰居並轉發傳輸流量。" },
      { id: 23, isDiagram: true, diagram: TOPOLOGY_SVGS.q23, badge: "圖示設定題", question: "Company deployed AP-635. To use 6 GHz, admin configured WPA3-OWE but not working. Correct action?", options: [{key:"A",text:"Change the SSID to WPA3-Enhanced Open."},{key:"B",text:"Change the SSID to WPA3-Personal."},{key:"C",text:"Change the SSID to WPA3-Enterprise (CNSA)."},{key:"D",text:"Change the SSID to WPA3-Enterprise (CCM)."}], answer: "A", explanation: "在 Aruba Central 介面中，WPA3-OWE 的正式名稱為 WPA3-Enhanced Open。" },
      { id: 24, question: "Allow new VLAN 100 between VSX pair inter-switch-link 256 for ports 1/45 and 2/45?", options: [{key:"A",text:"vlan trunk add 100 in LAG256"},{key:"B",text:"vlan trunk add 100 in MLAG256"},{key:"C",text:"vlan trunk allowed 100 for ports 1/45 and 1/46"},{key:"D",text:"vlan trunk allowed 100 in LAG256"}], answer: "D", explanation: "在 VSX ISL 聚合介面上放行 VLAN 的標準語法為 vlan trunk allowed 100 in LAG256。" },
      { id: 25, question: "AOS-CX VSX pair: Which information does Inter-Switch Protocol synchronize?", options: [{key:"A",text:"RPVST+"},{key:"B",text:"SVI"},{key:"C",text:"UDLD"},{key:"D",text:"MSTP"}], answer: "D", explanation: "VSX Inter-Switch Protocol 同步項目包含 MSTP 全域配置與狀態。" },
      { id: 26, question: "What is enabled by LLDP-MED?", options: [{key:"A",text:"Voice VLANs can be automatically configured for VoIP phones."},{key:"B",text:"GVRP VLAN info dynamically added to trunk"},{key:"C",text:"iSCSI set required MTU"},{key:"D",text:"iSCSI request flow control"}], answer: "A", explanation: "LLDP-MED 延伸協定專門用於向 VoIP 電話自動指派 Voice VLAN 與 QoS 參數。" },
      { id: 27, question: "CX 6100 show interface detail: Rx Power is 0.0001/-40.00 dBm. What can be observed?", options: [{key:"A",text:"Tx too far from 0, link down"},{key:"B",text:"Rx within acceptable, link up"},{key:"C",text:"The dBm values for Rx are too low, indicating that the link is down."},{key:"D",text:"Tx too high affects Rx"}], answer: "C", explanation: "Rx Power 低達 -40 dBm 且出現 loss of signal 告警，代表光信號微弱，鏈路中斷。" },
      { id: 28, question: "What is true regarding 802.11k?", options: [{key:"A",text:"Extends radio measurements for station management"},{key:"B",text:"Reduces roaming delay by pre-authenticating clients"},{key:"C",text:"It provides mechanisms for APs and clients to dynamically measure the available radio resources."},{key:"D",text:"Steers clients to 5GHz based on RSSI"}], answer: "C", explanation: "802.11k 規範了無線 AP 與終端動態測量射頻資源與獲取鄰居 AP 列表的機制。" },
      { id: 29, question: "CX 8325: configure IP 10.10.10.1 for SVI 100 and access port 1/1/1 in default state?", options: [{key:"A",text:"int vlan 100, ip address .1/24, int 1/1/1, switching, vlan access 100"},{key:"B",text:"int vlan 100, ip address 10.10.10.1/24, int 1/1/1 vlan access 100"},{key:"C",text:"trunking native 100 syntax"},{key:"D",text:"no routing vlan access syntax"}], answer: "B", explanation: "AOS-CX 正確語法：進入 int vlan 100 設定 IP，進入介面設定 vlan access 100。" },
      { id: 30, question: "Replacing 5406 switches with AOS-CX VSX. How to set up Spanning-tree synchronization?", options: [{key:"A",text:"Enable vsx-peer stp-global"},{key:"B",text:"Spanning-tree synced by default"},{key:"C",text:"Use vsx-sync in MSTP region"},{key:"D",text:"Enable vsx-sync stp-global in vsx mode to sync the configuration."}], answer: "D", explanation: "在 vsx 模式下輸入 vsx-sync stp-global 即可同步 STP 相關設定。" },
      { id: 31, question: "IoT devices require encrypted traffic, unique passphrase, role-based fingerprinting. (Choose two.)", options: [{key:"A",text:"MPSK and an internal RADIUS server"},{key:"B",text:"MPSK Local with MAC Authentication"},{key:"C",text:"Local User Derivation Rules"},{key:"D",text:"HPE Aruba Networking ClearPass Policy Manager"},{key:"E",text:"MPSK Local with EAP-TLS"}], answer: ["A","D"], explanation: "MPSK 提供每台設備獨立密碼，ClearPass 提供設備指紋分類與身分策略控制。" },
      { id: 32, question: "Retail client wants contextual data. Which standard uses RTT and FTM to calculate distance?", options: [{key:"A",text:"802.11mc"},{key:"B",text:"802.11be"},{key:"C",text:"802.11v"},{key:"D",text:"802.11ah"}], answer: "A", explanation: "802.11mc 定義了 Wi-Fi RTT 與 FTM，實現公尺級室內高精準度測距定位。" },
      { id: 33, question: "CX 6200 switches: correct commands to ensure no rogue DHCP server impacts the network?", options: [{key:"A",text:"dhcpv4-snooping globally, dhcpv4-snooping under vlans 100/110/120, lag 1 dhcpv4-snooping trust"},{key:"B",text:"dhcpv4-snooping all vlans syntax"},{key:"C",text:"dhcp snooping enable syntax"},{key:"D",text:"dhcp-snooping syntax"}], answer: "A", explanation: "AOS-CX 語法：全域與各 VLAN 啟用 dhcpv4-snooping，僅上聯 Uplink 設為 trust。" },
      { id: 34, question: "Configure SVI on AOS-CX: VLAN 25, IPv4, IPv6, VRF eng. Least commands?", options: [{key:"A",text:"vrf -> vlan -> int vlan -> ip -> vrf attach"},{key:"B",text:"int vlan attach without vrf created"},{key:"C",text:"vrf eng -> vlan 25 -> interface vlan 25 -> vrf attach eng -> ip address -> ipv6 address"},{key:"D",text:"mask 255 syntax"}], answer: "C", explanation: "依實務規則修正為 C：AOS-CX 必須先執行 vrf attach eng 再設 IP，否則 IP 會被清空。" },
      { id: 35, question: "Legacy L2 application over L3 network between CX 6200 switches at remote sites. Technology?", options: [{key:"A",text:"EoIP"},{key:"B",text:"Static VXLAN"},{key:"C",text:"GRE"},{key:"D",text:"IMET"}], answer: "B", explanation: "CX 6200 支援 Static VXLAN，可跨越 L3 網路封裝傳遞二層流量。" },
      { id: 36, question: "Statements true regarding VXLAN on HPE Aruba Networking switches? (Choose two.)", options: [{key:"A",text:"VNIs encapsulate/decapsulate"},{key:"B",text:"All switches support VXLAN"},{key:"C",text:"Only datacenter switches support"},{key:"D",text:"VTEPs encapsulate and decapsulate VXLAN traffic."},{key:"E",text:"MTU size must be increased beyond the default."}], answer: ["D","E"], explanation: "VTEP 負責 VXLAN 封裝與解封裝；由於增加了外層標頭，底層網路必須調大 MTU。" },
      { id: 37, question: "Advantage of using OCSP vs CRLs for certificate validation?", options: [{key:"A",text:"reduces latency between the time a certificate is revoked and validation reflects this status"},{key:"B",text:"higher availability"},{key:"C",text:"supports longer validity"},{key:"D",text:"less complex"}], answer: "A", explanation: "OCSP 提供即時在線憑證吊銷查詢，避免 CRL 下載週期的延遲空窗。" },
      { id: 38, question: "Deploy Gateway with all SD-WAN features. Which persona role should be selected?", options: [{key:"A",text:"AOS 10 Wireless"},{key:"B",text:"AOS 10 Mobility"},{key:"C",text:"AOS 10 VPN Concentrator"},{key:"D",text:"AOS 10 Branch"}], answer: "D", explanation: "AOS 10 Branch 角色提供動態路徑選擇與 WAN 優化等全套 SD-WAN 功能。" },
      { id: 39, question: "Device remains operational when remote link fails between Gateway cluster and RADIUS server?", options: [{key:"A",text:"MAC Authentication"},{key:"B",text:"Authentication survivability"},{key:"C",text:"MAC caching"},{key:"D",text:"Opportunistic key caching"}], answer: "B", explanation: "Authentication Survivability 允許網關在 RADIUS 斷線時於本地維持認證存活。" },
      { id: 40, question: "Authenticate single PC connected through VoIP phone on CX switches. Feature?", options: [{key:"A",text:"Device-Based Mode"},{key:"B",text:"Multi-Domain Authentication"},{key:"C",text:"Multi-Auth Mode"},{key:"D",text:"MAC Authentication"}], answer: "B", explanation: "MDA（多域認證）支援同一連接埠獨立對數據域（PC）與語音域（電話）進行驗證。" },
      { id: 41, question: "Cloud Guest visitors complain portal page appears after sleep. Solution?", options: [{key:"A",text:"MAC Caching under user-role"},{key:"B",text:"MAC Caching under WLAN"},{key:"C",text:"MAC Caching under the splash page"},{key:"D",text:"Wireless Caching under splash page"}], answer: "C", explanation: "在 Splash Page 設定中啟用 MAC Caching，設備喚醒後免重複輸入認證。" },
      { id: 42, question: "Advertise VLAN 20,30,40 in OSPF without forming new adjacencies on CX 6300 VSF?", options: [{key:"A",text:"ip ospf 1 area 0 no passive"},{key:"B",text:"ip ospf 1 area 0 with passive"},{key:"C",text:"#interface vlan 20,30,40 # ip ospf passive-interface"},{key:"D",text:"no ip ospf passive-interface"}], answer: "C", explanation: "確認答案為 C：將介面指定為 passive-interface 即可宣告網段而不建立鄰居。" },
      { id: 43, question: "Command to examine which role guest user has been assigned on AOS-CX access switch?", options: [{key:"A",text:"diag-dump captiveportal client verbose"},{key:"B",text:"show aaa authentication port-access interface all client-status"},{key:"C",text:"show port-access captiveportal profile"},{key:"D",text:"show port-access role"}], answer: "B", explanation: "此指令可完整檢視所有埠上已認證客戶端詳情及被指派的角色。" },
      { id: 44, question: "Minimize campus L2 flooding for legacy application across CX 6300 switches? Technology?", options: [{key:"A",text:"EoIP"},{key:"B",text:"GRE"},{key:"C",text:"Static VXLAN"},{key:"D",text:"EVPN-VXLAN"}], answer: "D", explanation: "EVPN-VXLAN 利用 BGP 控制面發布 MAC 位址，將泛洪轉化為精準單播。" },
      { id: 45, isDiagram: true, diagram: TOPOLOGY_SVGS.q45, badge: "拓撲分析題", question: "Sporadic DHCP failures for clients on CX 6100 via CX 8360 VSX core pair. Which action helps?", options: [{key:"A",text:"Enter on primary switch: vsx -> vsx-sync dhcp-relay -> exit"},{key:"B",text:"Add SVI on CX 6100"},{key:"C",text:"secondary ip relay-address"},{key:"D",text:"CX 6100 helper-address"}], answer: "A", explanation: "在 Primary 啟用 vsx-sync dhcp-relay 確保雙機具有一致的 DHCP Relay 設定。" },
      { id: 46, question: "Two steps to allow ClearPass to perform CoA on CX switch for misbehaving wired device? (Choose two.)", options: [{key:"A",text:"Confirm that NTP is configured on the switch and ClearPass."},{key:"B",text:"Use Dynamic Segmentation."},{key:"C",text:"Bounce the switchport."},{key:"D",text:"Configure dynamic authorization on switchport."},{key:"E",text:"Configure dynamic authorization on the switch."}], answer: ["A","E"], explanation: "依要求修正為 A, E：CoA 強制校驗時間戳記（NTP）且交換機全域需啟用動態授權。" },
      { id: 47, question: "Steps part of Key Management workflow when wireless roaming from AP1 to AP2? (Choose two.)", options: [{key:"A",text:"AP1 will cache the client's information and send it to Key Management service."},{key:"B",text:"Key Management receives all AP1's neighbors from AirMatch."},{key:"C",text:"Key Management receives AP2 neighbors"},{key:"D",text:"A client associates and authenticates with the AP2 after roaming from AP1."},{key:"E",text:"Generates R1 keys"}], answer: ["A","D"], explanation: "AP1 快取客戶端憑證送往金鑰管理服務，漫遊完成後客戶端與 AP2 完成關聯認證。" },
      { id: 48, isDiagram: true, diagram: TOPOLOGY_SVGS.q48, badge: "拓撲分析題", question: "VSX ISL fails, keepalive functions. Active gateway configured. Server access to Core? (Choose two.)", options: [{key:"A",text:"Server 2 access core via keepalive"},{key:"B",text:"Server 1 access core via both uplinks"},{key:"C",text:"Server 1 access core via keepalive"},{key:"D",text:"Server 1 and 2 communicate via core"},{key:"E",text:"Server 1 can access the core layer on only one uplink."},{key:"F",text:"Server 2 cannot access the core layer."}], answer: ["E","F"], explanation: "Secondary 關閉下聯防腦裂，Server 2 無法上聯 Core；Server 1 僅能透過 Primary 上聯。" },
      { id: 49, isDiagram: true, diagram: TOPOLOGY_SVGS.q49, badge: "圖示拓撲題", question: "AOS-10 session ACL allow ping from wired to wireless only, deny wireless to wired?", options: [{key:"A",text:"any any svc-icmp deny / any user svc-icmp permit"},{key:"B",text:"ip access-list session pingFromWired: user any svc-icmp deny / any any svc-icmp permit"},{key:"C",text:"any user any permit"},{key:"D",text:"any any permit / user any deny"}], answer: "B", explanation: "依您畫面紅色螢光筆指定修正為 B：阻斷 user 發起的 ICMP，允許反向回應放行。" },
      { id: 50, question: "Which statement best describes QoS?", options: [{key:"A",text:"Determining traffic passes quality metrics"},{key:"B",text:"Identifying specific traffic for special treatment"},{key:"C",text:"Scoring traffic based on quality"},{key:"D",text:"Identifying connection quality"}], answer: "B", explanation: "QoS 的核心本質是識別特定業務流量並提供差異化的排隊與轉發策略。" },
      { id: 51, question: "AOS-10 AP + gateway, traffic forwarding = mixed. Client connects to open enhanced SSID bridged?", options: [{key:"A",text:"Diffie-Hellman not utilized"},{key:"B",text:"The gateway will not respond."},{key:"C",text:"No encryption"},{key:"D",text:"RADIUS utilized"}], answer: "B", explanation: "本地橋接（Bridged）模式流量直接於 AP 本地轉發，閘道器不會介入回應。" },
      { id: 52, question: "Which network components communicate using RADIUS protocol for auth and accounting?", options: [{key:"A",text:"AP and endpoint"},{key:"B",text:"endpoint and RADIUS server"},{key:"C",text:"NAS and endpoint"},{key:"D",text:"a Network Access Server and a RADIUS authentication server"}], answer: "D", explanation: "RADIUS 協定運行於網路存取伺服器（NAS，如 AP/交換機）與 RADIUS 認證伺服器之間。" },
      { id: 53, question: "Which statements are true about VSX LAG? (Choose two.)", options: [{key:"A",text:"Traffic passed over ISL only when upgrading"},{key:"B",text:"Total links max 8"},{key:"C",text:"Outgoing traffic is preferentially switched to local members of the LAG."},{key:"D",text:"Up to 255 VSX LAGs can be configured on all 83xx and 84xx model switches."},{key:"E",text:"Hashing switch pair"}], answer: ["C","D"], explanation: "VSX LAG 優先本地轉發以節省 ISL 頻寬，83xx/84xx 系列支援高達 255 組 VSX LAG。" },
      { id: 54, question: "VSX CX 8360 with multiple VRFs. Client connected to CX 6100. How to find IP from MAC?", options: [{key:"A",text:"Run on CX 6100 switch: show arp all-vrfs"},{key:"B",text:"primary show mac-address-table"},{key:"C",text:"secondary show arp summary"},{key:"D",text:"primary show arp all-vrfs"}], answer: "A", explanation: "在終端直接相連的 CX 6100 上執行 show arp all-vrfs 可查得該 MAC 對應的 IP。" },
      { id: 55, question: "Unmanaged switches cause outages. Switch should warn helpdesk. Solution?", options: [{key:"A",text:"Configure loop protection on all edge ports of CX 6200/6300 and set up the trap-option"},{key:"B",text:"loop guard trap"},{key:"C",text:"spanning tree 8325"},{key:"D",text:"spanning tree no trap"}], answer: "A", explanation: "在接入邊界埠啟用 loop protection 並配置 SNMP trap，可阻斷迴圈並即時告警。" },
      { id: 56, question: "Minimize client latency in high-density by eliminating contention, dedicating subcarriers. Tech?", options: [{key:"A",text:"Channel Bonding"},{key:"B",text:"OFDMA"},{key:"C",text:"WMM"},{key:"D",text:"MU-MIMO"}], answer: "B", explanation: "OFDMA 將無線信道劃分為正交子載波（RU），允許多終端併發傳輸消除爭用。" },
      { id: 57, question: "Two statements regarding NAE agents are true? (Choose two.)", options: [{key:"A",text:"A single NAE agent can be used by multiple NAE scripts."},{key:"B",text:"A single NAE script can be used by multiple NAE agents."},{key:"C",text:"NAE scripts signed by HPE"},{key:"D",text:"Processor limit 10%"},{key:"E",text:"Active all times"}], answer: ["A","B"], explanation: "NAE 具備彈性架構，Script 與 Agent 之間具備一對多與多對一的重用關係。" },
      { id: 58, question: "Cloud RADIUS 802.1X auth. Traffic between AP and RADIUS server exposed. Solution?", options: [{key:"A",text:"Enable IPSec Central"},{key:"B",text:"EAP-TTLS on clients"},{key:"C",text:"Configure RadSec on the AP and the RADIUS server."},{key:"D",text:"EAP-TLS on clients"}], answer: "C", explanation: "RadSec（RADIUS over TLS）將認證封包於 TLS 隧道中加密，確保雲端傳輸安全。" },
      { id: 59, question: "PBR for subnet 10.2.250.0/24 default route to 10.1.1.253. Other non-default routes unaffected. (Choose two.)", options: [{key:"A",text:"class / policy routed-out"},{key:"B",text:"default-nexthop /24 syntax"},{key:"C",text:"nexthop interface null"},{key:"D",text:"class ip test_subnet 10 match any 10.2.250.0/24 any, policy def_route_test_policy routed-in"},{key:"E",text:"pbr-action-list def_route_test default-nexthop 10.1.1.253 interface null"}], answer: ["D","E"], explanation: "正確定義 PBR 類別並在 routed-in 方向生效，並宣告包含 default-nexthop 的動作清單。" },
      { id: 60, question: "AOS-10 Gateways: device persona only available when configuring Gateway-only group?", options: [{key:"A",text:"Edge"},{key:"B",text:"Branch"},{key:"C",text:"Mobility"},{key:"D",text:"VPN Concentrator"}], answer: "D", explanation: "VPN Concentrator（VPNC）是唯有在純網關群組中才能選取的專屬角色。" },
      { id: 61, question: "Onboard new UXI in 802.1X environment without cellular connection?", options: [{key:"A",text:"Use the HPE Aruba Networking installer app on smartphone to scan barcode."},{key:"B",text:"Connect from installed UXI"},{key:"C",text:"CLI serial cable"},{key:"D",text:"Bluetooth app"}], answer: "A", explanation: "使用手機端 Aruba Installer App 掃描感測器條碼即可快速配置並完成入網。" },
      { id: 62, question: "Aruba 9004 gateway ZTP wrong port caused rogue DHCP handing 172.16.0.81. Action?", options: [{key:"A",text:"Move cable to G0/0/1 Central"},{key:"B",text:"Factory reboot"},{key:"C",text:"Turn off DHCP scope"},{key:"D",text:"Move the cable on the gateway from port G0/0/1 to port G0/0/0."}], answer: "D", explanation: "9004 網關預設 WAN/ZTP 介面為 G0/0/0，插錯為 LAN 埠會導致本地網段遭配發 IP。" },
      { id: 63, question: "Dynamic Segmentation tunnels between CX switch and gateway not encrypted. Action?", options: [{key:"A",text:"Enable Enhanced security"},{key:"B",text:"Enable Secure Mode Enhanced"},{key:"C",text:"Enable Enhanced PAPI security"},{key:"D",text:"Enable GRE security"}], answer: "B", explanation: "啟用 Secure Mode Enhanced 可為動態微隔離穿隧的控制面與數據面提供全面加密。" },
      { id: 64, question: "Difference between Class of Service (CoS) and Differentiated Services Code Point (DSCP)?", options: [{key:"A",text:"CoS finer granularity"},{key:"B",text:"Interchangeable"},{key:"C",text:"CoS class DSCP diff"},{key:"D",text:"CoS is only contained in VLAN Tag fields. DSCP is in IP Header and preserved throughout IP packet flow."}], answer: "D", explanation: "CoS 位於二層 802.1Q 標籤中，DSCP 位於三層 IP 標頭中，可跨路由端到端保留。" },
      { id: 65, question: "ERSPAN session on AOS-CX switch: Statements true? (Choose two.)", options: [{key:"A",text:"Destination specified is switch desktop connected"},{key:"B",text:"Encapsulation VXLAN"},{key:"C",text:"On the source AOS-CX switch, the destination specified is the administrator's desktop."},{key:"D",text:"The encapsulation protocol used is GRE."},{key:"E",text:"Encapsulation UDP"}], answer: ["C","D"], explanation: "ERSPAN 採用 GRE 封裝鏡像封包，可跨三層直接將封包送達管理員桌機 IP。" },

      { id: 161, isDrag: true, dragType: "match", badge: "拖曳配對題", question: "Match fiber type and connector to transceiver type.", slots: ["100G QSFP28 SR4 transceiver", "40G QSFP+ BIDI transceiver", "100G QSFP28 LR4 transceiver", "10G SFP+ SR transceiver"], items: ["Multimode Fiber MPO 12-fiber connector", "Multimode Fiber LC Connector", "Single-Mode Fiber LC connector"], isMultiUse: true, correctMatches: ["Multimode Fiber MPO 12-fiber connector", "Multimode Fiber LC Connector", "Single-Mode Fiber LC connector", "Multimode Fiber LC Connector"], answer: "拖曳配對", explanation: "100G SR4 用 MPO 多模；40G BIDI 與 10G SR 用雙工 LC 多模；100G LR4 為長距單模用 LC。" }
    ];

    // 全真題資料庫格式化
    const EXAM_DATABASE = RAW_EXAM_DATABASE.map(formatQuestionItem).sort((a, b) => a.id - b.id);

    // 全域狀態變數
    let curList = [];
    let curIdx = 0;
    let curMode = 'all19';
    let userAnswers = {}; // 儲存已選「文字內容」陣列或單一字串
    let selectedSourceItem = null;
    let dbFilter = 'all';
    let dbRendered = false;

    // 洗牌演算法（Fisher-Yates Shuffle）
    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getStoredWrongs() {
      try {
        return new Set(JSON.parse(localStorage.getItem('hpe7_a01_wrongs') || '[]'));
      } catch (e) {
        return new Set();
      }
    }

    function saveStoredWrongs(wrongSet) {
      try {
        localStorage.setItem('hpe7_a01_wrongs', JSON.stringify([...wrongSet]));
      } catch (e) {}
    }

    let wrongIds = getStoredWrongs();

    function updateWrongCountBadge() {
      const el = document.getElementById('home-wrong-count');
      if (el) el.innerText = wrongIds.size;

      const totalEl = document.getElementById('stat-total-count');
      const diagEl = document.getElementById('stat-diag-count');
      const dragEl = document.getElementById('stat-drag-count');
      const pureChoiceEl = document.getElementById('stat-pure-choice-count');

      const diagCount = EXAM_DATABASE.filter(q => q.isDiagram).length;
      const dragCount = EXAM_DATABASE.filter(q => q.isDrag).length;
      const pureChoiceCount = EXAM_DATABASE.filter(q => !q.isDiagram && !q.isDrag).length;

      if (totalEl) totalEl.innerText = EXAM_DATABASE.length;
      if (diagEl) diagEl.innerText = diagCount;
      if (dragEl) dragEl.innerText = dragCount;
      if (pureChoiceEl) pureChoiceEl.innerText = pureChoiceCount;
    }

    function showHome() {
      document.getElementById('view-home').style.display = 'block';
      document.getElementById('view-quiz').style.display = 'none';
      document.getElementById('view-score').style.display = 'none';
      updateWrongCountBadge();
    }

    // 啟動測驗模式（進入測驗時動態打亂純選擇題選項順序）
    function startQuiz(mode) {
      curMode = mode;
      let rawList = [];
      if (mode === 'all19') {
        rawList = EXAM_DATABASE.filter(q => CORE_19_IDS.includes(q.id));
        document.getElementById('quiz-mode-pill').innerText = "核心19題全練";
      } else if (mode === 'pure_choice') {
        rawList = EXAM_DATABASE.filter(q => !q.isDiagram && !q.isDrag);
        document.getElementById('quiz-mode-pill').innerText = `純選擇題 (${rawList.length}題)`;
      } else if (mode === 'diagram') {
        rawList = EXAM_DATABASE.filter(q => q.isDiagram);
        document.getElementById('quiz-mode-pill').innerText = `專攻圖示 (${rawList.length}題)`;
      } else if (mode === 'drag') {
        rawList = EXAM_DATABASE.filter(q => q.isDrag);
        document.getElementById('quiz-mode-pill').innerText = `專攻拖曳 (${rawList.length}題)`;
      } else if (mode === 'random') {
        rawList = [...EXAM_DATABASE].sort(() => Math.random() - 0.5);
        document.getElementById('quiz-mode-pill').innerText = `隨機模擬 (${rawList.length}題)`;
      } else if (mode === 'wrong') {
        if (wrongIds.size === 0) {
          alert("目前沒有錯題紀錄喔！太棒了！");
          return;
        }
        rawList = EXAM_DATABASE.filter(q => wrongIds.has(q.id));
        document.getElementById('quiz-mode-pill').innerText = `錯題專區 (${rawList.length}題)`;
      }

      // 深層複製題目物件，並將選擇題選項順序打亂洗牌
      curList = rawList.map(item => {
        let cloned = { ...item };
        if (!cloned.isDrag && cloned.originalOptions && cloned.originalOptions.length > 0) {
          let shuffledTexts = shuffleArray(cloned.originalOptions.map(o => o.text));
          const keys = ["A", "B", "C", "D", "E", "F"];
          cloned.currentOptions = shuffledTexts.map((txt, idx) => ({
            key: keys[idx] || String.fromCharCode(65 + idx),
            text: txt
          }));
        }
        return cloned;
      });

      curIdx = 0;
      userAnswers = {};
      selectedSourceItem = null;
      
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-quiz').style.display = 'flex';
      document.getElementById('view-score').style.display = 'none';
      
      renderQ();
    }

    function retryCurrentMode() {
      startQuiz(curMode);
    }

    function renderQ() {
      const q = curList[curIdx];
      if (!q) return;

      document.getElementById('quiz-progress').innerText = `${curIdx + 1} / ${curList.length}`;
      document.getElementById('q-id-text').innerText = `#Q${q.id}`;
      document.getElementById('q-badge').innerText = q.badge;
      document.getElementById('q-text').innerText = q.question;

      const diagSlot = document.getElementById('q-diagram-slot');
      diagSlot.innerHTML = q.diagram ? q.diagram : '';

      const explainBox = document.getElementById('q-explain-box');
      if (explainBox) explainBox.style.display = 'none';

      const optSlot = document.getElementById('q-options-slot');
      optSlot.innerHTML = '';

      if (q.isDrag) {
        if (!userAnswers[q.id]) {
          userAnswers[q.id] = {
            placed: {},
            pool: q.isMultiUse ? [...q.items] : [...q.items].sort(() => Math.random() - 0.5)
          };
        }
        renderInteractiveDragUI(q, optSlot);
      } else {
        const curPickedTexts = userAnswers[q.id] || [];
        const optsToRender = q.currentOptions || q.originalOptions || [];
        const isMultiple = q.correctTexts.length > 1;

        if (optsToRender.length > 0) {
          optsToRender.forEach(opt => {
            const isSelected = isMultiple ? curPickedTexts.includes(opt.text) : (userAnswers[q.id] === opt.text);

            const div = document.createElement('div');
            div.className = `p-3 rounded-2xl border text-xs sm:text-sm flex items-start gap-2.5 cursor-pointer touch-btn ${
              isSelected ? 'border-aruba bg-aruba/20 text-white font-medium shadow-md' : 'border-slate-800 bg-[#070D18] text-slate-300 hover:border-slate-700'
            }`;
            div.onclick = () => selectOption(opt.text);
            div.innerHTML = `
              <span class="w-5 h-5 rounded-md flex items-center justify-center font-bold text-[10px] flex-shrink-0 ${
                isSelected ? 'bg-aruba text-white' : 'bg-slate-800 text-slate-400'
              }">${opt.key}</span>
              <div class="flex-1 whitespace-pre-line leading-snug">${opt.text}</div>
            `;
            optSlot.appendChild(div);
          });
        }
      }

      document.getElementById('btn-prev').disabled = (curIdx === 0);
      const nextBtn = document.getElementById('btn-next');
      if (curIdx === curList.length - 1) {
        nextBtn.innerHTML = `完成交卷 <i class="fa-solid fa-check ml-1"></i>`;
      } else {
        nextBtn.innerHTML = `下一題 <i class="fa-solid fa-arrow-right ml-1"></i>`;
      }
    }

    function renderInteractiveDragUI(q, container) {
      const state = userAnswers[q.id];
      const wrap = document.createElement('div');
      wrap.className = "space-y-3 pt-1";

      wrap.innerHTML = `
        <div class="flex items-center justify-between text-[11px] text-slate-400 pb-1">
          <span><i class="fa-solid fa-hand-pointer text-aruba mr-1"></i>操作：<b>點選卡片 ➔ 點目標空格</b> 放入</span>
          <button onclick="resetDragQuestion(${q.id})" class="text-slate-400 hover:text-white underline text-[10px]">清空重來</button>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

      const leftCol = document.createElement('div');
      leftCol.className = "space-y-2";
      leftCol.innerHTML = `<div class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-list-ol mr-1"></i>目標空格</div>`;

      q.slots.forEach((slotLabel, sIdx) => {
        const slotDiv = document.createElement('div');
        slotDiv.className = "drop-slot p-2 rounded-xl border border-dashed border-slate-700 bg-slate-950/60 flex flex-col justify-center relative";
        slotDiv.dataset.slotIdx = sIdx;

        slotDiv.ondragover = (e) => { e.preventDefault(); slotDiv.classList.add('drag-over'); };
        slotDiv.ondragleave = () => { slotDiv.classList.remove('drag-over'); };
        slotDiv.ondrop = (e) => {
          e.preventDefault();
          slotDiv.classList.remove('drag-over');
          const itemText = e.dataTransfer.getData("text/plain");
          if (itemText) placeItemIntoSlot(itemText, sIdx);
        };

        slotDiv.onclick = () => {
          if (selectedSourceItem) {
            placeItemIntoSlot(selectedSourceItem, sIdx);
            selectedSourceItem = null;
            renderQ();
          }
        };

        const assignedItem = state.placed[sIdx];
        if (assignedItem) {
          slotDiv.className = "drop-slot p-2 rounded-xl border border-aruba/60 bg-aruba/10 flex items-center justify-between text-xs text-white";
          slotDiv.innerHTML = `
            <div class="flex items-start gap-2 flex-1 pr-2">
              <span class="w-5 h-5 rounded bg-aruba text-white font-bold text-[10px] flex items-center justify-center flex-shrink-0 mt-0.5">${sIdx + 1}</span>
              <div class="leading-tight flex-1">
                <span class="text-[10px] text-slate-400 block">${slotLabel}</span>
                <span class="font-medium text-amber-200">${assignedItem}</span>
              </div>
            </div>
            <button onclick="event.stopPropagation(); removeItemFromSlot(${q.id}, ${sIdx})" class="text-slate-400 hover:text-rose-400 text-xs px-1.5 py-1 touch-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
        } else {
          slotDiv.innerHTML = `
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span class="w-5 h-5 rounded border border-slate-700 bg-slate-900 text-slate-400 font-mono text-[10px] flex items-center justify-center flex-shrink-0">${sIdx + 1}</span>
              <div class="flex-1">
                <span class="text-[11px] text-slate-400 block">${slotLabel}</span>
                <span class="text-[10px] text-slate-500 italic">點選放入...</span>
              </div>
            </div>
          `;
        }
        leftCol.appendChild(slotDiv);
      });

      const rightCol = document.createElement('div');
      rightCol.className = "space-y-2";
      rightCol.innerHTML = `<div class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-box-open mr-1"></i>答案卡片池</div>`;

      let availableItems = [];
      if (q.isMultiUse) {
        availableItems = [...q.items];
      } else {
        const placedValues = Object.values(state.placed);
        availableItems = state.pool.filter(item => !placedValues.includes(item));
      }

      if (availableItems.length === 0) {
        rightCol.innerHTML += `<div class="text-xs text-slate-500 italic p-3 border border-slate-800 rounded-xl bg-slate-950/40 text-center">所有卡片皆已放置</div>`;
      } else {
        availableItems.forEach((itemText) => {
          const itemDiv = document.createElement('div');
          const isSelected = (selectedSourceItem === itemText);
          itemDiv.className = `drag-item p-2.5 rounded-xl border text-xs text-slate-200 flex items-center justify-between touch-btn ${
            isSelected ? 'selected border-aruba bg-aruba/30 text-white shadow-md' : 'border-slate-800 bg-[#0B1120] hover:border-slate-700'
          }`;
          itemDiv.draggable = true;

          itemDiv.ondragstart = (e) => {
            e.dataTransfer.setData("text/plain", itemText);
            itemDiv.style.opacity = '0.4';
          };
          itemDiv.ondragend = () => { itemDiv.style.opacity = '1'; };

          itemDiv.onclick = () => {
            if (selectedSourceItem === itemText) {
              selectedSourceItem = null;
            } else {
              selectedSourceItem = itemText;
            }
            renderQ();
          };

          itemDiv.innerHTML = `
            <span class="leading-tight select-none">${itemText}</span>
            <i class="fa-solid fa-grip-vertical text-slate-500 text-xs ml-2 flex-shrink-0"></i>
          `;
          rightCol.appendChild(itemDiv);
        });
      }

      grid.appendChild(leftCol);
      grid.appendChild(rightCol);
      wrap.appendChild(grid);
      container.appendChild(wrap);
    }

    function placeItemIntoSlot(itemText, slotIdx) {
      const q = curList[curIdx];
      const state = userAnswers[q.id];
      state.placed[slotIdx] = itemText;
      renderQ();
    }

    function removeItemFromSlot(qId, slotIdx) {
      const state = userAnswers[qId];
      if (state && state.placed) {
        delete state.placed[slotIdx];
        renderQ();
      }
    }

    function resetDragQuestion(qId) {
      const q = curList.find(item => item.id === qId);
      if (q) {
        userAnswers[qId] = {
          placed: {},
          pool: q.isMultiUse ? [...q.items] : [...q.items].sort(() => Math.random() - 0.5)
        };
        selectedSourceItem = null;
        renderQ();
      }
    }

    // 依「選項文字」記錄作答，徹底脫鉤字母與位置
    function selectOption(optText) {
      const q = curList[curIdx];
      const isMultiple = q.correctTexts.length > 1;

      if (isMultiple) {
        let list = Array.isArray(userAnswers[q.id]) ? [...userAnswers[q.id]] : [];
        if (list.includes(optText)) {
          list = list.filter(t => t !== optText);
        } else {
          list.push(optText);
        }
        userAnswers[q.id] = list;
      } else {
        userAnswers[q.id] = optText;
      }
      renderQ();
    }

    function toggleExplain() {
      const q = curList[curIdx];
      if (!q) return;

      const box = document.getElementById('q-explain-box');
      const keyEl = document.getElementById('q-explain-key');
      const textEl = document.getElementById('q-explain-text');

      if (q.isDrag) {
        let ansSummary = "";
        q.correctMatches.forEach((match, idx) => {
          ansSummary += `【空格 ${idx + 1}】${match} ； `;
        });
        keyEl.innerText = ansSummary;
      } else {
        // 動態計算當前洗牌順序下，正確答案的按鈕字母標籤
        const currentOpts = q.currentOptions || q.originalOptions || [];
        let matchingCurrentKeys = [];
        currentOpts.forEach(o => {
          if (q.correctTexts.includes(o.text)) {
            matchingCurrentKeys.push(`${o.key}. ${o.text}`);
          }
        });
        keyEl.innerText = matchingCurrentKeys.join('  |  ');
      }

      textEl.innerText = q.explanation || "原廠認證考試核心觀念。";
      box.style.display = (box.style.display === 'none' ? 'block' : 'none');
    }

    function nextQ() {
      if (curIdx < curList.length - 1) {
        curIdx++;
        selectedSourceItem = null;
        renderQ();
      } else {
        finishQuiz();
      }
    }

    function prevQ() {
      if (curIdx > 0) {
        curIdx--;
        selectedSourceItem = null;
        renderQ();
      }
    }

    function finishQuiz() {
      let correct = 0;
      let total = curList.length;

      curList.forEach(q => {
        let isOk = false;
        const u = userAnswers[q.id];

        if (q.isDrag) {
          if (u && u.placed) {
            const matches = q.correctMatches;
            let allMatch = true;
            for (let i = 0; i < matches.length; i++) {
              if (u.placed[i] !== matches[i]) {
                allMatch = false;
                break;
              }
            }
            if (allMatch && Object.keys(u.placed).length === matches.length) isOk = true;
          }
        } else {
          const isMultiple = q.correctTexts.length > 1;
          if (isMultiple) {
            if (Array.isArray(u) && u.length === q.correctTexts.length) {
              const uSorted = [...u].sort();
              const cSorted = [...q.correctTexts].sort();
              if (JSON.stringify(uSorted) === JSON.stringify(cSorted)) isOk = true;
            }
          } else {
            if (u && q.correctTexts.includes(u)) isOk = true;
          }
        }

        if (isOk) {
          correct++;
          wrongIds.delete(q.id);
        } else {
          wrongIds.add(q.id);
        }
      });

      saveStoredWrongs(wrongIds);
      updateWrongCountBadge();

      const pct = Math.round((correct / total) * 100);
      document.getElementById('score-pct').innerText = `${pct}%`;
      document.getElementById('score-count').innerText = `${correct} / ${total} 題`;

      document.getElementById('view-quiz').style.display = 'none';
      document.getElementById('view-score').style.display = 'flex';
    }

    // ================= 題庫速查彈跳視窗 =================
    function openDatabaseModal() {
      const m = document.getElementById('modal-database');
      if (m) {
        m.style.display = 'flex';
        if (!dbRendered) {
          renderDatabaseModalList();
          dbRendered = true;
        }
        const input = document.getElementById('db-search-input');
        if (input) input.focus();
      }
    }

    function closeDatabaseModal() {
      const m = document.getElementById('modal-database');
      if (m) m.style.display = 'none';
    }

    function setDbFilter(f) {
      dbFilter = f;
      document.querySelectorAll('.db-chip').forEach(btn => {
        if (btn.dataset.filter === f) {
          btn.className = "db-chip active whitespace-nowrap px-2.5 py-1 rounded-lg font-bold bg-aruba text-white";
        } else {
          btn.className = "db-chip whitespace-nowrap px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700";
        }
      });
      filterDatabase();
    }

    function renderDatabaseModalList() {
      const container = document.getElementById('db-list-container');
      if (!container) return;
      container.innerHTML = '';

      EXAM_DATABASE.forEach(item => {
        const card = document.createElement('div');
        card.className = "db-card bg-slate-900 border border-slate-800 rounded-2xl p-3.5 sm:p-4 space-y-2.5 shadow-md";
        card.dataset.id = item.id;
        card.dataset.diagram = item.isDiagram ? "true" : "false";
        card.dataset.drag = item.isDrag ? "true" : "false";
        card.dataset.purechoice = (!item.isDiagram && !item.isDrag) ? "true" : "false";

        let badgeHtml = item.isDiagram 
          ? '<span class="text-[10px] bg-blue-500/20 text-blue-400 font-bold px-2 py-0.5 rounded border border-blue-500/30">🖼️ 圖示拓撲</span>'
          : (item.isDrag 
              ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded border border-emerald-500/30">🧩 拖曳配對</span>'
              : '<span class="text-[10px] bg-slate-800 text-slate-400 font-bold px-2 py-0.5 rounded">📝 純選擇題</span>');

        let html = `
          <div class="flex items-center justify-between border-b border-slate-800 pb-1.5">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded bg-slate-800 text-aruba font-bold font-mono text-xs flex items-center justify-center">#${item.id}</span>
              <span class="font-bold text-white text-xs">Question ${item.id}</span>
            </div>
            ${badgeHtml}
          </div>
          <div class="text-xs sm:text-sm text-slate-100 font-medium leading-relaxed whitespace-pre-line">${item.question}</div>
        `;

        if (item.diagram) html += item.diagram;

        if (item.originalOptions && item.originalOptions.length > 0) {
          html += `<div class="space-y-1 pt-1">`;
          item.originalOptions.forEach(opt => {
            const isCorrect = item.correctTexts.includes(opt.text.trim());
            let optCls = isCorrect ? "border-emerald-500/60 bg-emerald-500/10 text-emerald-300 font-medium" : "border-slate-800/80 bg-[#070D18] text-slate-400";
            html += `
              <div class="p-2 rounded-xl border text-xs flex items-start gap-2 ${optCls}">
                <span class="w-4 h-4 rounded flex items-center justify-center font-bold text-[9px] flex-shrink-0 ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}">${opt.key}</span>
                <div class="flex-1 leading-snug whitespace-pre-line">${opt.text}</div>
              </div>
            `;
          });
          html += `</div>`;
        }

        html += `
          <div class="bg-[#070D18] p-3 rounded-xl border border-slate-800 text-xs space-y-1 mt-2">
            <div class="flex items-center gap-2">
              <span class="text-slate-400 font-bold">標準答案：</span>
              <span class="font-mono font-bold text-emerald-400">${Array.isArray(item.answer) ? item.answer.join(', ') : item.answer}</span>
            </div>
            <div class="text-slate-300 text-[11px] leading-relaxed pt-0.5 border-t border-slate-800/60">
              <b class="text-aruba mr-1"><i class="fa-solid fa-lightbulb mr-1"></i>原因與官方解析：</b>${item.explanation || ''}
            </div>
          </div>
        `;

        card.innerHTML = html;
        container.appendChild(card);
      });
      document.getElementById('db-counter').innerText = `共 ${EXAM_DATABASE.length} 題`;
    }

    function filterDatabase() {
      const query = document.getElementById('db-search-input').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.db-card');
      let count = 0;

      cards.forEach(card => {
        const isDiag = card.dataset.diagram === "true";
        const isDrag = card.dataset.drag === "true";
        const isPureChoice = card.dataset.purechoice === "true";
        const id = card.dataset.id;
        const text = card.innerText.toLowerCase();

        let matchType = true;
        if (dbFilter === 'diagram' && !isDiag) matchType = false;
        if (dbFilter === 'drag' && !isDrag) matchType = false;
        if (dbFilter === 'pure_choice' && !isPureChoice) matchType = false;

        let matchQuery = true;
        if (query) {
          matchQuery = `#${id}`.includes(query) || `q${id}`.includes(query) || text.includes(query);
        }

        if (matchType && matchQuery) {
          card.style.display = 'block';
          count++;
        } else {
          card.style.display = 'none';
        }
      });

      document.getElementById('db-counter').innerText = `符合 ${count} 題`;
    }

    // 啟動首頁數據計算
    updateWrongCountBadge();
  </script>
</body>
</html>
